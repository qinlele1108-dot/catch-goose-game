<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>抓大鹅 · 百宝大盆 180</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff5d4,#c9f1dd);font-family:system-ui,-apple-system,sans-serif;color:#493a30}main{max-width:620px;margin:auto;padding:10px}h1{text-align:center;margin:5px;font-size:28px}.hint{text-align:center;margin:5px;font-size:13px}.bar,.tools{display:flex;justify-content:space-around;gap:7px;margin:9px 0}.bar span,button{background:#fffaf0;border:0;border-radius:14px;padding:9px;font-weight:700;box-shadow:0 3px 0 #c9b994}button{touch-action:manipulation;cursor:pointer}.tools button{flex:1}.bowl{position:relative;height:min(59dvh,590px);min-height:370px;overflow:hidden;border:13px solid #f6e8ce;border-radius:46% 46% 44% 44%/15% 15% 18% 18%;background:radial-gradient(ellipse at 50% 48%,#d6b681 0%,#b58d57 68%,#91683b 100%);box-shadow:inset 0 0 30px #65461c99,0 10px 15px #6d5c3b55}.item{position:absolute;display:grid;place-items:center;background:transparent;border:0;padding:0;line-height:1;filter:drop-shadow(1px 4px 2px #49371988);transition:transform .12s;user-select:none;-webkit-user-select:none}.item:active{transform:scale(.85)!important}.item:disabled{pointer-events:none}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px;background:#bd8b50;border:5px solid #fff2cf;border-radius:20px}.slot{aspect-ratio:1;display:grid;place-items:center;border:2px dashed #f7d6a3;border-radius:10px;background:#fce6b9;font-size:clamp(19px,5vw,31px)}#msg{text-align:center;font-weight:700;min-height:23px;margin:8px}.veil{display:none;position:fixed;inset:0;background:#271d15a8;z-index:999;align-items:center;justify-content:center;padding:15px}.veil.show{display:flex}.modal{background:#fff5da;border:6px solid white;border-radius:25px;padding:25px;text-align:center;max-width:350px}.modal button{background:#b9e8a4;padding:13px 25px}@media(max-width:400px){main{padding:6px}.bowl{min-height:355px}.bar span{padding:7px 4px;font-size:13px}}</style></head><body><main><h1>🪿 抓大鹅 · 百宝大盆</h1><p class="hint">180 件不同大小的好物！点选最上层，三个相同即可消除</p><div class="bar"><span>第 <b id="level">1</b> 关</span><span>盆内 <b id="left">180</b> 件</span><span>消除 <b id="done">0</b> 件</span></div><div class="bowl" id="bowl"></div><p class="hint">🧺 收集篮（最多 7 件）</p><div class="tray" id="tray"></div><div class="tools"><button id="undo">↩ 撤回 3</button><button id="shuffle">🔀 洗牌 3</button><button id="restart">⟳ 重开</button></div><p id="msg">先从盆里最上面的物品开始抓吧！</p></main><div class="veil" id="veil"><div class="modal"><h2 id="title"></h2><p id="detail"></p><button id="again">再来一次</button></div></div><script>(()=>{'use strict';const pool='🍎 🍏 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶️ 🫑 🌽 🥕 🧄 🧅 🥔 🍠 🥐 🍞 🥖 🥨 🥯 🧀 🥚 🍳 🥞 🧇 🥓 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🌮 🌯 🥙 🧆 🍜 🍝 🍣 🍤 🍙 🍚 🍩 🍪 🎂 🍰 🧁 🍫 🍬 🍭 🍿 🥛 🧃 🧋 ☕ 🫖 🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦆 🦉 🐝 🦋 🐞 🐢 🐙 🐠 🐬 🦀 🐘 🦒 🦓 🦄 🌻 🌹 🌷 🌵 🍀 🌈 ⭐ 🌙 ☀️ ⚽ 🏀 🏈 ⚾ 🎾 🏐 🎱 🎲 🧸 🪀 🪁 🎮 🎧 🎸 🎹 🎺 🥁 🚗 🚕 🚌 🚲 🛴 🚀 ✈️ 🚁 ⛵ 🚂 ⏰ ⌚ 📱 💻 📷 🔑 🔒 💡 🔦 🧲 🧹 🧽 🪣 🧴 🪥 🧼 🧻 🧤 🧦 👟 👒 🎩 👑 💍 🎒 ☂️ 📚 ✏️ 🖍️ ✂️ 📎 📌 🧷 🪑 🛏️ 🛋️ 🪞 🪴'.split(' ');const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);let level=1,items=[],tray=[],history=[],undos=3,shuffles=3,done=0,ended=false,serial=0;function init(){items=[];tray=[];history=[];undos=3;shuffles=3;done=0;ended=false;$('veil').classList.remove('show');const count=180;let kinds=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(pool.length,42+level*6)),bag=[];for(let i=0;i<count/3;i++){let icon=kinds[rnd(kinds.length)];bag.push(icon,icon,icon)}for(let i=bag.length-1;i>0;i--){let j=rnd(i+1);[bag[i],bag[j]]=[bag[j],bag[i]]}for(let i=0;i<count;i++){let layer=Math.floor(i/30),a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.43;items.push({id:++serial,icon:bag[i],x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r*.87,z:layer,size:31+rnd(24),rot:rnd(61)-30})}draw();$('msg').textContent='盆里有 180 件物品，找到三个相同的！'}function top(t){return !items.some(o=>o.id!==t.id&&o.z>t.z&&Math.hypot((o.x-t.x)*1.1,(o.y-t.y)*1.3)<(o.size+t.size)/1100)}function draw(){const b=$('bowl'),w=b.clientWidth,h=b.clientHeight;b.replaceChildren();for(let t of items){let el=document.createElement('button');el.className='item';el.textContent=t.icon;el.style.fontSize=t.size+'px';el.style.width=t.size*1.22+'px';el.style.height=t.size*1.22+'px';el.style.left=(t.x*w-t.size*.61)+'px';el.style.top=(t.y*h-t.size*.61)+'px';el.style.zIndex=t.z*1000+t.id%1000;el.style.transform='rotate('+t.rot+'deg)';el.setAttribute('aria-label','抓取 '+t.icon);el.onclick=()=>pick(t.id);b.append(el)}const c=$('tray');c.replaceChildren();for(let i=0;i<7;i++){let s=document.createElement('div');s.className='slot';s.textContent=tray[i]||'';c.append(s)}$('level').textContent=level;$('left').textContent=items.length;$('done').textContent=done;$('undo').textContent='↩ 撤回 '+undos;$('shuffle').textContent='🔀 洗牌 '+shuffles;$('undo').disabled=!undos||!history.length||ended;$('shuffle').disabled=!shuffles||!items.length||ended}function pick(id){if(ended)return;let index=items.findIndex(t=>t.id===id);if(index<0)return;let t=items[index];if(!top(t)){$('msg').textContent='这件物品被压住了，先抓上面的！';return}history.push({items:items.map(o=>({...o})),tray:[...tray],done});items.splice(index,1);let pos=tray.lastIndexOf(t.icon);tray.splice(pos<0?tray.length:pos+1,0,t.icon);if(tray.filter(x=>x===t.icon).length===3){tray=tray.filter(x=>x!==t.icon);done+=3;$('msg').textContent='✨ 三件相同，消除成功！'}else $('msg').textContent='继续找相同的物品！';draw();if(!items.length&&!tray.length)finish(true);else if(tray.length>=7)finish(false)}function finish(win){ended=true;$('title').textContent=win?'🪿 抓到大鹅啦！':'🧺 收集篮满了';$('detail').textContent=win?'180 件好物全部清空，恭喜过关！':'可以撤回一步，或者重新挑战！';$('again').textContent=win?'下一关':'重新挑战';$('veil').classList.add('show');draw()}$('undo').onclick=()=>{if(!history.length||!undos||ended)return;let h=history.pop();items=h.items;tray=h.tray;done=h.done;undos--;draw()};$('shuffle').onclick=()=>{if(!shuffles||ended)return;let icons=items.map(t=>t.icon);for(let i=icons.length-1;i>0;i--){let j=rnd(i+1);[icons[i],icons[j]]=[icons[j],icons[i]]}items.forEach((t,i)=>t.icon=icons[i]);shuffles--;draw();$('msg').textContent='🔀 已重新混合盆内物品'};$('restart').onclick=init;$('again').onclick=()=>{if(!items.length&&!tray.length)level++;init()};window.addEventListener('resize',draw);init()})();</script></body></html>
