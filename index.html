<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>抓大鹅 · 三消挑战</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#fff5d6,#c9f3e8);color:#34413b;min-height:100dvh}main{max-width:580px;margin:auto;padding:14px}header{text-align:center}h1{margin:6px 0;font-size:30px}p{margin:6px 0}.stats,.actions{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.pill,button{border:0;border-radius:14px;background:white;padding:10px;box-shadow:0 3px 0 #cbd9cf;font-weight:700}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}.board{position:relative;height:min(57dvh,510px);min-height:310px;background:radial-gradient(ellipse,#f8e5ba,#e6c68e);border:7px solid #fff;border-radius:30px;overflow:hidden;box-shadow:inset 0 5px 20px #bd9b6344,0 6px 18px #66877744}.tile{position:absolute;width:53px;height:53px;border:3px solid #fff;border-radius:15px;background:#fffdf2;display:grid;place-items:center;font-size:29px;box-shadow:0 4px 0 #c5ac7d,0 6px 8px #725d3640;transition:transform .12s,filter .12s;user-select:none;-webkit-user-select:none}.tile:not(.blocked):active{transform:scale(.9)}.blocked{filter:brightness(.7) saturate(.6);pointer-events:none}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:9px;background:#e3b77b;border:4px solid white;border-radius:19px;min-height:69px}.slot{min-width:0;aspect-ratio:1;background:#fff9e9;border:2px dashed #d1ad76;border-radius:11px;display:grid;place-items:center;font-size:clamp(18px,6vw,30px)}.actions button{flex:1;background:#fffaf0}.message{text-align:center;min-height:25px;font-weight:700}.overlay{position:fixed;inset:0;background:#243a30a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.dialog{width:min(95vw,380px);background:#fff9e7;border:5px solid white;border-radius:26px;padding:24px;text-align:center}.dialog h2{font-size:30px}.dialog button{background:#c3f4a8;padding:14px 30px}@media(max-width:400px){.tile{width:46px;height:46px;font-size:25px}.board{min-height:330px}.pill{font-size:13px;padding:9px 6px}}</style></head><body><main><header><h1>🪿 抓大鹅</h1><p>找到三个相同物品消除，清空盘子就能抓到大鹅！</p></header><div class="stats"><div class="pill">关卡 <span id="level">1</span></div><div class="pill">剩余 <span id="remaining">0</span></div><div class="pill">已消除 <span id="cleared">0</span></div></div><div id="board" class="board" aria-label="物品盘"></div><p style="font-weight:700">收集槽（最多 7 格）</p><div id="tray" class="tray"></div><div class="actions"><button id="undo">↩ 撤回 <span id="undos">2</span></button><button id="shuffle">🔀 洗牌 <span id="shuffles">2</span></button><button id="restart">⟳ 重开</button></div><p id="message" class="message">点击没有被压住的物品</p></main><div id="overlay" class="overlay"><div class="dialog"><h2 id="endTitle"></h2><p id="endText"></p><button id="next">再来一局</button></div></div><script>(()=>{'use strict';const icons=['🍎','🍋','🍇','🥕','🍓','🥦','🍄','🥑','🍞','🧀','🍉','🍒','🌽','🥥','🍑','🍍'];const $=id=>document.getElementById(id);let level=1,tiles=[],tray=[],history=[],undos=2,shuffles=2,cleared=0,ended=false;const rand=n=>Math.floor(Math.random()*n);function setup(){tiles=[];tray=[];history=[];undos=2;shuffles=2;cleared=0;ended=false;$('overlay').classList.remove('show');const count=level===1?36:level===2?54:72;let types=icons.slice(0,Math.min(icons.length,6+level*2));let bag=[];for(let i=0;i<count/3;i++){let icon=types[rand(types.length)];bag.push(icon,icon,icon)}for(let i=bag.length-1;i>0;i--){let j=rand(i+1);[bag[i],bag[j]]=[bag[j],bag[i]]}let layers=level===1?2:3;let perLayer=Math.ceil(count/layers);for(let i=0;i<count;i++){let z=Math.floor(i/perLayer),pos=i%perLayer,cols=6,rows=Math.ceil(perLayer/cols),col=pos%cols,row=Math.floor(pos/cols);let x=(col+.5+(z%2)*.35+(Math.random()-.5)*.12)/7,y=(row+.65+(z%2)*.3+(Math.random()-.5)*.12)/(rows+1.5);tiles.push({id:i,icon:bag[i],x:Math.min(.9,x),y:Math.min(.88,y),z})}render()}function overlap(a,b){return Math.abs(a.x-b.x)<.105&&Math.abs(a.y-b.y)<.105}function blocked(t){return tiles.some(other=>other.z>t.z&&overlap(t,other))}function render(){let board=$('board');board.innerHTML='';const w=board.clientWidth,h=board.clientHeight,size=w<390?46:53;for(let t of [...tiles].sort((a,b)=>a.z-b.z)){let el=document.createElement('button');el.className='tile'+(blocked(t)?' blocked':'');el.textContent=t.icon;el.style.left=Math.max(0,Math.min(w-size,t.x*w-size/2))+'px';el.style.top=Math.max(0,Math.min(h-size,t.y*h-size/2))+'px';el.style.zIndex=t.z+1;el.setAttribute('aria-label',t.icon+(blocked(t)?' 被遮挡':''));el.disabled=blocked(t)||ended;el.addEventListener('click',()=>pick(t.id));board.appendChild(el)}$('tray').innerHTML='';for(let i=0;i<7;i++){let slot=document.createElement('div');slot.className='slot';slot.textContent=tray[i]||'';$('tray').appendChild(slot)}$('level').textContent=level;$('remaining').textContent=tiles.length;$('cleared').textContent=cleared;$('undos').textContent=undos;$('shuffles').textContent=shuffles;$('undo').disabled=!undos||!history.length||ended;$('shuffle').disabled=!shuffles||!tiles.length||ended}function pick(id){if(ended)return;let idx=tiles.findIndex(t=>t.id===id);if(idx<0||blocked(tiles[idx]))return;history.push({tiles:tiles.map(t=>({...t})),tray:[...tray],cleared});let [tile]=tiles.splice(idx,1);let insert=tray.lastIndexOf(tile.icon);tray.splice(insert<0?tray.length:insert+1,0,tile.icon);if(tray.filter(x=>x===tile.icon).length===3){tray=tray.filter(x=>x!==tile.icon);cleared+=3;$('message').textContent='✨ 三个相同物品，消除成功！'}else{$('message').textContent='继续寻找相同物品！'}render();if(!tiles.length&&tray.length===0)finish(true);else if(tray.length>=7)finish(false)}function finish(win){ended=true;$('endTitle').textContent=win?'🪿 抓到大鹅啦！':'😵 收集槽满啦';$('endText').textContent=win?'恭喜通关！继续挑战更难的盘子吧。':'试试撤回或洗牌，重新挑战！';$('next').textContent=win?'下一关':'重新挑战';$('overlay').classList.add('show');render()}$('undo').onclick=()=>{if(!history.length||!undos||ended)return;let last=history.pop();tiles=last.tiles;tray=last.tray;cleared=last.cleared;undos--;$('message').textContent='已撤回上一步';render()};$('shuffle').onclick=()=>{if(!shuffles||ended)return;let available=tiles.filter(t=>!blocked(t));if(available.length<2)return;let values=available.map(t=>t.icon);for(let i=values.length-1;i>0;i--){let j=rand(i+1);[values[i],values[j]]=[values[j],values[i]]}available.forEach((t,i)=>t.icon=values[i]);shuffles--;$('message').textContent='已洗牌可选物品';render()};$('restart').onclick=()=>{setup();$('message').textContent='新的一局开始啦！'};$('next').onclick=()=>{if($('endTitle').textContent.includes('抓到'))level++;setup()};window.addEventListener('resize',render);setup()})();</script></body></html>
