<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>抓大鹅 · 满盆好物</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#443223;background:radial-gradient(circle at 50% 0,#fff7dc,#f8dcae 75%);min-height:100dvh;user-select:none;-webkit-user-select:none}main{max-width:690px;margin:auto;padding:12px 13px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:25px;margin:4px 0}.pill{border-radius:30px;background:#fff9e9;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 #d9b67f}.subtitle{font-size:13px;color:#806447;margin:6px 0 12px}.board{position:relative;aspect-ratio:1.05/1;max-height:65dvh;margin:auto;touch-action:manipulation}.basin{position:absolute;inset:1.5% 0 0;border-radius:50% / 43%;background:radial-gradient(ellipse at 44% 35%,#c8dce0 0,#a9c5c8 45%,#78999e 74%,#d4e5e4 79%,#7d9da3 83%,#f3ffff 86%,#a6c6c8 92%,#759aa0 100%);box-shadow:0 12px 24px #9e784b6b,inset 0 8px 10px #fff9,inset 0 -13px 25px #315e6859;border:4px solid #e8f2ed}.rim{position:absolute;inset:2% 1%;border:10px solid #dceced;border-radius:50% / 43%;box-shadow:inset 0 4px 7px #547f8a80,0 3px 6px #ffffff9c;pointer-events:none;z-index:1000}.item{position:absolute;display:grid;place-items:center;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;transform:translate(-50%,-50%) rotate(var(--rot));filter:drop-shadow(1px 5px 2px #253c3d70);transition:transform .14s,filter .14s;line-height:1;z-index:var(--z)}.item .emoji{font-size:var(--fs);display:block;line-height:1.1;filter:saturate(1.18)}.item:active{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.85)}.item:focus-visible{outline:3px solid #ffce37;border-radius:20px}.item.blocked{filter:brightness(.82) drop-shadow(1px 4px 2px #253c3d88)}.traybox{background:#fff9e9;border-radius:22px;padding:12px;margin:12px 0;box-shadow:0 5px 0 #e3bc7c}.trayhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px}.tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.slot{aspect-ratio:1;border-radius:12px;background:#e7d5b5;box-shadow:inset 0 3px 5px #b99c70a6;display:grid;place-items:center;font-size:clamp(20px,5.8vw,35px)}.slot.filled{background:#fff2d3;box-shadow:0 2px 0 #d6b37e}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,.dialog button{border:0;border-radius:15px;background:#fff9e9;padding:12px 4px;font-weight:900;color:#62421d;box-shadow:0 4px 0 #d5ae6d;font-size:15px}.actions button:disabled{opacity:.45}.actions button:active,.dialog button:active{transform:translateY(2px);box-shadow:0 2px 0 #d5ae6d}.tip{font-size:12px;text-align:center;color:#806447;margin:14px 0}.overlay{position:fixed;inset:0;background:#3225148c;display:grid;place-items:center;z-index:3000;padding:22px}.overlay[hidden]{display:none}.dialog{width:min(100%,360px);text-align:center;border-radius:25px;padding:24px;background:#fff8e4;box-shadow:0 12px 40px #0004}.dialog h2{font-size:26px}.dialog p{line-height:1.7}.dialog button{background:#ffcf65;padding:13px 30px}.flash{animation:pop .24s ease}@keyframes pop{50%{transform:scale(1.15)}}
</style></head><body><main><div class="top"><h1>🪿 抓大鹅</h1><div class="pill" id="level">第 1 关</div></div><div class="subtitle">满盆好物 · 点击最上面的物品，三个相同就能消除</div><div class="top"><div class="pill" id="left">盆中剩余 0</div><div class="pill" id="moves">已抓 0 次</div></div><div class="board" id="board"><div class="basin"></div><div class="rim"></div></div><section class="traybox"><div class="trayhead"><span>🧺 收集篮</span><span id="capacity">0 / 7</span></div><div class="tray" id="tray"></div></section><div class="actions"><button id="undo">↩ 撤回</button><button id="shuffle">🔀 摇一摇</button><button id="restart">🔄 重开</button></div><p class="tip">盆里物品有大有小、相互叠放；先拿走上层，才能取到下面的好物。篮子放满 7 件且没有凑成三件，就会失败。</p></main><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="next">继续挑战</button></div></div><script>
(()=>{'use strict';const icons=['🥬','🥕','🍅','🥒','🌽','🍆','🥔','🧅','🧄','🥦','🌶️','🍄','🍋','🍎','🍐','🍓','🍊','🍉','🍌','🍇','🥑','🥥','🍍','🫑'];const board=document.getElementById('board'),trayEl=document.getElementById('tray'),overlay=document.getElementById('overlay');let level=1,items=[],tray=[],history=[],moves=0,shuffles=2,uid=0,finished=false;const $=id=>document.getElementById(id);function rand(a,b){return a+Math.random()*(b-a)}function mix(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function generate(){const types=icons.slice(0,Math.min(icons.length,7+level*2));const triples=Math.min(16,7+level*3);let bag=[];for(let i=0;i<triples;i++){let kind=types[i%types.length];bag.push(kind,kind,kind)}mix(bag);items=bag.map((kind,i)=>{let layer=Math.floor(i/Math.ceil(bag.length/3));let angle=rand(0,Math.PI*2),radius=Math.sqrt(Math.random())*38;let x=50+Math.cos(angle)*radius,y=50+Math.sin(angle)*radius*.76;return{id:++uid,kind,x,y,size:rand(7.5,13.5),rot:rand(-55,55),z:i+1,alive:true}});tray=[];history=[];moves=0;shuffles=2;finished=false;overlay.hidden=true;render()}function overlaps(a,b){let dx=(a.x-b.x)*1.0,dy=(a.y-b.y)*1.05;return Math.abs(dx)<(a.size+b.size)*.43&&Math.abs(dy)<(a.size+b.size)*.44}function blocked(it){return items.some(other=>other.alive&&other.z>it.z&&overlaps(it,other))}function render(){board.querySelectorAll('.item').forEach(el=>el.remove());const fragment=document.createDocumentFragment();for(const it of items){if(!it.alive)continue;let el=document.createElement('button');el.className='item'+(blocked(it)?' blocked':'');el.type='button';el.setAttribute('aria-label','抓取'+it.kind);el.style.cssText=`left:${it.x}%;top:${it.y}%;width:${it.size}%;height:${it.size*1.08}%;--rot:${it.rot}deg;--fs:clamp(24px,${it.size*.65}vw,68px);--z:${it.z};`;let span=document.createElement('span');span.className='emoji';span.textContent=it.kind;el.append(span);el.addEventListener('click',()=>pick(it.id));fragment.append(el)}board.append(fragment);trayEl.replaceChildren();for(let i=0;i<7;i++){let slot=document.createElement('div');slot.className='slot'+(tray[i]?' filled':'');slot.textContent=tray[i]||'';trayEl.append(slot)}$('left').textContent=`盆中剩余 ${items.filter(it=>it.alive).length}`;$('moves').textContent=`已抓 ${moves} 次`;$('level').textContent=`第 ${level} 关`;$('capacity').textContent=`${tray.length} / 7`;$('undo').disabled=!history.length||finished;$('shuffle').disabled=!shuffles||finished;$('shuffle').textContent=`🔀 摇一摇 (${shuffles})`;}function snapshot(){return{items:items.map(it=>({...it})),tray:[...tray],moves,shuffles}}function pick(id){if(finished)return;let it=items.find(it=>it.id===id);if(!it||!it.alive||blocked(it))return;history.push(snapshot());it.alive=false;moves++;tray.push(it.kind);let count=tray.filter(k=>k===it.kind).length;if(count>=3){let removed=0;tray=tray.filter(k=>{if(k===it.kind&&removed<3){removed++;return false}return true})}render();if(items.every(it=>!it.alive)){finished=true;show('🎉 抓到大鹅啦！',`恭喜通关！一共抓取 ${moves} 次。`,'下一关',()=>{level++;generate()})}else if(tray.length>=7){finished=true;show('🧺 篮子装满啦',`本关抓取 ${moves} 次，再试一次吧！`,'重新挑战',generate)}}function show(title,text,button,callback){$('resultTitle').textContent=title;$('resultText').textContent=text;$('next').textContent=button;$('next').onclick=callback;overlay.hidden=false;render()}$('undo').onclick=()=>{if(!history.length||finished)return;let old=history.pop();items=old.items;tray=old.tray;moves=old.moves;shuffles=old.shuffles;render()};$('shuffle').onclick=()=>{if(!shuffles||finished)return;history.push(snapshot());shuffles--;let alive=items.filter(it=>it.alive);let kinds=mix(alive.map(it=>it.kind));alive.forEach((it,i)=>it.kind=kinds[i]);render()};$('restart').onclick=()=>{level=1;generate()};generate();})();
</script></body></html>
