<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>抓大鹅 · 美妆大盆 90 · 灵敏触控版</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ffe5f0,#f6d7ff);font-family:system-ui,-apple-system,sans-serif;color:#633951}main{max-width:650px;margin:auto;padding:8px}h1{text-align:center;margin:5px;font-size:27px}.hint{text-align:center;margin:5px;font-size:13px}.bar,.tools{display:flex;justify-content:space-around;gap:7px;margin:9px 0}.bar span,button{background:#fff9fc;border:0;border-radius:14px;padding:9px;font-weight:700;box-shadow:0 3px 0 #d8b4c6}button{touch-action:manipulation;cursor:pointer}.tools button{flex:1}.bowl{position:relative;height:min(61dvh,620px);min-height:390px;overflow:hidden;border:13px solid #fff0f6;border-radius:45% 45% 42% 42%/15% 15% 18% 18%;background:radial-gradient(ellipse at 50% 48%,#f6d3e2 0%,#d99fbd 70%,#ac6c91 100%);box-shadow:inset 0 0 30px #81476888,0 10px 15px #6d3d5b55;touch-action:manipulation}.item{position:absolute;display:grid;place-items:center;background:transparent;border:0;padding:0;line-height:1;filter:drop-shadow(1px 4px 2px #57304788);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:none;border-radius:50%}.item img,.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none}.item:active{filter:drop-shadow(0 0 6px #fff)}.item:focus-visible{outline:3px solid #a93f82}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px;background:#b779a0;border:5px solid #fff2f9;border-radius:20px}.slot{aspect-ratio:1;display:grid;place-items:center;border:2px dashed #f5c5df;border-radius:10px;background:#ffe6f2}#msg{text-align:center;font-weight:700;min-height:23px;margin:8px}.veil{display:none;position:fixed;inset:0;background:#30152ba8;z-index:40000;align-items:center;justify-content:center;padding:15px}.veil.show{display:flex}.modal{background:#fff1fa;border:6px solid white;border-radius:25px;padding:25px;text-align:center;max-width:350px}.modal button{background:#f6bbd7;padding:13px 25px}#preview{position:fixed;left:50%;top:4%;transform:translateX(-50%);z-index:30000;display:none;pointer-events:none}#preview.show{display:block}#preview img{display:block;width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 10px 16px #40223555)}@media(max-width:430px){main{padding:6px}.bowl{min-height:380px}.bar span{padding:7px 4px;font-size:13px}#preview{top:3%}#preview img{width:170px;height:170px}}
</style></head><body><main><h1>💄 抓大鹅 · 美妆大盆</h1><p class="hint">90 件超大美妆好物！轻点即可抓取；按住放大查看</p><div class="bar"><span>第 <b id="level">1</b> 关</span><span>盆内 <b id="left">90</b> 件</span><span>消除 <b id="done">0</b> 件</span></div><div class="bowl" id="bowl"></div><p class="hint">🧺 收集篮（最多 7 件）</p><div class="tray" id="tray"></div><div class="tools"><button id="undo">↩ 撤回 3</button><button id="shuffle">🔀 洗牌 3</button><button id="restart">⟳ 重开</button></div><p id="msg">轻点盆里最上面的化妆品！</p></main><div id="preview" aria-hidden="true"><img id="previewImg" alt=""></div><div class="veil" id="veil"><div class="modal"><h2 id="title"></h2><p id="detail"></p><button id="again">再来一次</button></div></div><script>
(()=>{'use strict';
const names=['口红','唇釉','粉饼','眼影盘','香水','粉底液','睫毛膏','眼线笔','化妆刷','腮红','指甲油','护肤霜','卸妆水','精华液','防晒霜','面膜','眉笔','散粉','高光盘','唇线笔','气垫','护手霜','美妆蛋','卷睫毛器'];
const colors=['#d94766','#d55c91','#f5c8a5','#b890d7','#e8b8dc','#e6b58e','#24212d','#514052','#d7a17e','#e991a7','#d94183','#e7d4f4','#b1d8e8','#f0c37d','#f7e1a2','#a9dfca','#745149','#f2d9b8','#efcbe0','#b95165','#e7bdd2','#c7b2e8','#ed9cba','#c6a6a9'];
const kinds=['lip','gloss','compact','palette','perfume','bottle','mascara','pencil','brush','compact','polish','jar','bottle','dropper','tube','mask','pencil','jar','compact','pencil','compact','tube','sponge','curler'];
function image(color,kind){let shape='';switch(kind){case'lip':shape=`<rect x="35" y="42" width="30" height="39" rx="4" fill="#262433"/><rect x="39" y="31" width="22" height="16" fill="#d5b4a2"/><path d="M39 31V20Q50 5 61 20V31Z" fill="${color}"/>`;break;case'gloss':shape=`<rect x="34" y="35" width="32" height="48" rx="9" fill="${color}"/><rect x="38" y="12" width="24" height="27" rx="4" fill="#32283a"/>`;break;case'compact':shape=`<circle cx="50" cy="52" r="35" fill="#c79a75"/><circle cx="50" cy="52" r="29" fill="${color}"/><path d="M27 39Q50 21 73 39" fill="none" stroke="#fff9" stroke-width="5"/>`;break;case'palette':shape=`<rect x="8" y="23" width="84" height="58" rx="9" fill="#5a4059"/><rect x="13" y="29" width="74" height="46" rx="5" fill="#f8e5f0"/>${[0,1,2,3,4,5].map(i=>`<circle cx="${29+i%3*21}" cy="${41+Math.floor(i/3)*22}" r="8" fill="${['#dc9cb2','#d8b4e8','#ad82b1','#f3c19c','#b77e95','#e9c8a2'][i]}"/>`).join('')}`;break;case'perfume':shape=`<rect x="27" y="30" width="46" height="54" rx="10" fill="${color}" stroke="#fff" stroke-width="3"/><rect x="43" y="16" width="14" height="15" fill="#d8b77b"/><rect x="36" y="8" width="28" height="11" rx="3" fill="#544459"/><circle cx="50" cy="56" r="11" fill="#fff8"/>`;break;case'bottle':shape=`<rect x="30" y="28" width="40" height="57" rx="8" fill="${color}"/><rect x="38" y="17" width="24" height="14" rx="2" fill="#c4a2aa"/><rect x="48" y="10" width="24" height="5" rx="2" fill="#8d7385"/><rect x="44" y="11" width="5" height="9" fill="#8d7385"/><rect x="36" y="48" width="28" height="17" rx="4" fill="#fff9"/>`;break;case'mascara':shape=`<rect x="40" y="34" width="20" height="52" rx="5" fill="${color}"/><rect x="43" y="12" width="14" height="24" rx="3" fill="#d4a5b7"/>`;break;case'pencil':shape=`<path d="M40 86L44 17Q50 5 56 17L60 86Z" fill="${color}"/><path d="M40 86L50 98L60 86" fill="#e5c2a0"/><path d="M46 92L50 98L54 92" fill="#3c2e3b"/>`;break;case'brush':shape=`<rect x="45" y="42" width="10" height="48" rx="4" fill="#aa7a65"/><rect x="42" y="32" width="16" height="15" rx="3" fill="#d6b5b7"/><path d="M42 34Q29 9 50 8Q71 9 58 34Z" fill="${color}"/>`;break;case'polish':shape=`<rect x="29" y="39" width="42" height="44" rx="10" fill="${color}"/><rect x="40" y="13" width="20" height="29" rx="4" fill="#26222f"/>`;break;case'jar':shape=`<rect x="19" y="42" width="62" height="39" rx="11" fill="${color}"/><rect x="16" y="30" width="68" height="16" rx="5" fill="#d2b6c7"/><rect x="31" y="54" width="38" height="13" rx="5" fill="#fff9"/>`;break;case'dropper':shape=`<rect x="33" y="36" width="34" height="49" rx="9" fill="${color}"/><rect x="40" y="20" width="20" height="20" fill="#c6a8b7"/><rect x="43" y="9" width="14" height="15" rx="6" fill="#37303e"/>`;break;case'tube':shape=`<path d="M29 21H71L65 83H35Z" fill="${color}"/><rect x="34" y="81" width="32" height="10" rx="3" fill="#c7a9b4"/><rect x="35" y="37" width="30" height="22" rx="4" fill="#fff9"/>`;break;case'mask':shape=`<rect x="20" y="16" width="60" height="71" rx="13" fill="${color}"/><circle cx="39" cy="46" r="5" fill="#78596d"/><circle cx="61" cy="46" r="5" fill="#78596d"/><path d="M41 68Q50 76 59 68" stroke="#78596d" fill="none" stroke-width="3"/>`;break;case'sponge':shape=`<path d="M50 9Q82 46 75 67Q70 88 50 88Q30 88 25 67Q18 46 50 9Z" fill="${color}"/>`;break;case'curler':shape=`<path d="M22 28Q50 7 78 28M22 28V49Q50 70 78 49V28M40 57L29 88M60 57L71 88" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"/>`;break}return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><ellipse cx="50" cy="90" rx="25" ry="5" fill="#492c3b33"/>${shape}</svg>`)}
const art=names.map((_,i)=>image(colors[i],kinds[i]));const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);let level=1,items=[],tray=[],history=[],undos=3,shuffles=3,done=0,ended=false,serial=0,holdTimer=null,activePointer=null,holdShown=false;
function hidePreview(){clearTimeout(holdTimer);$('preview').classList.remove('show')}
function preview(t){$('previewImg').src=art[t.kind];$('preview').classList.add('show')}
function init(){hidePreview();items=[];tray=[];history=[];undos=3;shuffles=3;done=0;ended=false;$('veil').classList.remove('show');let bag=[];for(let i=0;i<30;i++){let kind=rnd(names.length);bag.push(kind,kind,kind)}for(let i=bag.length-1;i>0;i--){let j=rnd(i+1);[bag[i],bag[j]]=[bag[j],bag[i]]}for(let i=0;i<90;i++){let layer=Math.floor(i/18),a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.42;items.push({id:++serial,kind:bag[i],x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r*.82,z:layer,size:112+rnd(25),rot:rnd(41)-20})}draw();$('msg').textContent='盆里有 90 件超大美妆好物！'}
function order(t){return t.z*1000+t.id%1000}
function draw(){hidePreview();const b=$('bowl'),w=b.clientWidth,h=b.clientHeight;b.replaceChildren();for(const t of items){let el=document.createElement('button');el.type='button';el.className='item';let img=document.createElement('img');img.src=art[t.kind];img.alt='';el.append(img);el.style.width=t.size+'px';el.style.height=t.size+'px';el.style.left=Math.max(0,Math.min(w-t.size,t.x*w-t.size/2))+'px';el.style.top=Math.max(0,Math.min(h-t.size,t.y*h-t.size/2))+'px';el.style.zIndex=order(t);el.style.transform='rotate('+t.rot+'deg)';el.setAttribute('aria-label','抓取'+names[t.kind]);el.onpointerdown=e=>{if(ended)return;activePointer={id:e.pointerId,item:t.id,x:e.clientX,y:e.clientY};holdShown=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{if(activePointer&&activePointer.id===e.pointerId&&activePointer.item===t.id){holdShown=true;preview(t)}},420)};el.onpointermove=e=>{if(activePointer&&activePointer.id===e.pointerId&&Math.hypot(e.clientX-activePointer.x,e.clientY-activePointer.y)>18){clearTimeout(holdTimer);hidePreview();activePointer=null}};el.onpointerup=e=>{if(!activePointer||activePointer.id!==e.pointerId)return;let wasHold=holdShown;activePointer=null;hidePreview();if(!wasHold)pick(t.id)};el.onpointercancel=()=>{activePointer=null;hidePreview()};el.onpointerleave=()=>{if(!holdShown){clearTimeout(holdTimer)}};el.oncontextmenu=e=>e.preventDefault();el.onclick=e=>{if(e.detail===0)pick(t.id)};b.append(el)}const c=$('tray');c.replaceChildren();for(let i=0;i<7;i++){let s=document.createElement('div');s.className='slot';if(i<tray.length){let img=document.createElement('img');img.src=art[tray[i]];img.alt=names[tray[i]];s.append(img)}c.append(s)}$('level').textContent=level;$('left').textContent=items.length;$('done').textContent=done;$('undo').textContent='↩ 撤回 '+undos;$('shuffle').textContent='🔀 洗牌 '+shuffles;$('undo').disabled=!undos||!history.length||ended;$('shuffle').disabled=!shuffles||!items.length||ended}
function pick(id){if(ended)return;let index=items.findIndex(t=>t.id===id);if(index<0)return;const t=items[index];history.push({items:items.map(o=>({...o})),tray:[...tray],done});items.splice(index,1);tray.push(t.kind);let count=tray.filter(k=>k===t.kind).length;if(count===3){tray=tray.filter(k=>k!==t.kind);done+=3;$('msg').textContent='成功消除 3 件 '+names[t.kind]+'！'}else{$('msg').textContent='抓到了 '+names[t.kind]+'！'}draw();if(!items.length){ended=true;$('title').textContent='🎉 通关成功！';$('detail').textContent='90 件美妆好物全部清空！';$('veil').classList.add('show')}else if(tray.length>=7){ended=true;$('title').textContent='😢 收集篮满了';$('detail').textContent='这次消除了 '+done+' 件，点击再来一次！';$('veil').classList.add('show')}drawButtons()}
function drawButtons(){$('undo').disabled=!undos||!history.length||ended;$('shuffle').disabled=!shuffles||!items.length||ended}
$('undo').onclick=()=>{if(!undos||!history.length||ended)return;let s=history.pop();items=s.items;tray=s.tray;done=s.done;undos--;draw();$('msg').textContent='已撤回上一步'};
$('shuffle').onclick=()=>{if(!shuffles||!items.length||ended)return;shuffles--;for(let i=items.length-1;i>0;i--){let j=rnd(i+1);[items[i].kind,items[j].kind]=[items[j].kind,items[i].kind]}history=[];draw();$('msg').textContent='已洗牌！'};
$('restart').onclick=()=>{level=1;init()};$('again').onclick=()=>{level++;init()};window.addEventListener('blur',()=>{activePointer=null;hidePreview()});init();
})();
</script></body></html>
