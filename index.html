<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>抓大鹅 · 美妆大盆 90 · 大物品版</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ffe5f0,#f6d7ff);font-family:system-ui,-apple-system,sans-serif;color:#633951}main{max-width:650px;margin:auto;padding:10px}h1{text-align:center;margin:5px;font-size:27px}.hint{text-align:center;margin:5px;font-size:13px}.bar,.tools{display:flex;justify-content:space-around;gap:7px;margin:9px 0}.bar span,button{background:#fff9fc;border:0;border-radius:14px;padding:9px;font-weight:700;box-shadow:0 3px 0 #d8b4c6}button{touch-action:manipulation;cursor:pointer}.tools button{flex:1}.bowl{position:relative;height:min(61dvh,620px);min-height:390px;overflow:hidden;border:13px solid #fff0f6;border-radius:45% 45% 42% 42%/15% 15% 18% 18%;background:radial-gradient(ellipse at 50% 48%,#f6d3e2 0%,#d99fbd 70%,#ac6c91 100%);box-shadow:inset 0 0 30px #81476888,0 10px 15px #6d3d5b55}.item{position:absolute;display:grid;place-items:center;background:transparent;border:0;padding:0;line-height:1;filter:drop-shadow(1px 4px 2px #57304788);user-select:none;-webkit-user-select:none;touch-action:manipulation}.item img,.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none}.item:active{scale:.91}.item:focus-visible{outline:3px solid #a93f82;border-radius:12px}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px;background:#b779a0;border:5px solid #fff2f9;border-radius:20px}.slot{aspect-ratio:1;display:grid;place-items:center;border:2px dashed #f5c5df;border-radius:10px;background:#ffe6f2}#msg{text-align:center;font-weight:700;min-height:23px;margin:8px}.veil{display:none;position:fixed;inset:0;background:#30152ba8;z-index:40000;align-items:center;justify-content:center;padding:15px}.veil.show{display:flex}.modal{background:#fff1fa;border:6px solid white;border-radius:25px;padding:25px;text-align:center;max-width:350px}.modal button{background:#f6bbd7;padding:13px 25px}#preview{position:fixed;left:50%;top:4%;transform:translateX(-50%);z-index:30000;display:none;pointer-events:none;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;text-align:center}#preview.show{display:block}#preview img{display:block;width:180px;height:180px;object-fit:contain;margin:auto;filter:drop-shadow(0 10px 16px #40223555)}@media(max-width:430px){main{padding:6px}.bowl{min-height:380px}.bar span{padding:7px 4px;font-size:13px}#preview{top:3%}#preview img{width:155px;height:155px}}</style></head><body><main><h1>💄 抓大鹅 · 美妆大盆</h1><p class="hint">90 件超大美妆好物！按住即可放大查看，松开恢复；点选最上层收集</p><div class="bar"><span>第 <b id="level">1</b> 关</span><span>盆内 <b id="left">90</b> 件</span><span>消除 <b id="done">0</b> 件</span></div><div class="bowl" id="bowl"></div><p class="hint">🧺 收集篮（最多 7 件）</p><div class="tray" id="tray"></div><div class="tools"><button id="undo">↩ 撤回 3</button><button id="shuffle">🔀 洗牌 3</button><button id="restart">⟳ 重开</button></div><p id="msg">先从盆里最上面的化妆品开始抓吧！</p></main><div id="preview" aria-hidden="true"><img id="previewImg" alt=""></div><div class="veil" id="veil"><div class="modal"><h2 id="title"></h2><p id="detail"></p><button id="again">再来一次</button></div></div><script>(()=>{'use strict';const types=[['口红','#d94766','lip'],['唇釉','#d55c91','gloss'],['粉饼','#f5c8a5','compact'],['眼影盘','#b890d7','palette'],['香水','#e8b8dc','perfume'],['粉底液','#e6b58e','bottle'],['睫毛膏','#24212d','mascara'],['眼线笔','#514052','pencil'],['化妆刷','#d7a17e','brush'],['腮红','#e991a7','compact'],['指甲油','#d94183','polish'],['护肤霜','#e7d4f4','jar'],['卸妆水','#b1d8e8','bottle'],['精华液','#f0c37d','dropper'],['防晒霜','#f7e1a2','tube'],['面膜','#a9dfca','mask'],['眉笔','#745149','pencil'],['散粉','#f2d9b8','jar'],['高光盘','#efcbe0','compact'],['唇线笔','#b95165','pencil'],['气垫','#e7bdd2','compact'],['护手霜','#c7b2e8','tube'],['美妆蛋','#ed9cba','sponge'],['卷睫毛器','#c6a6a9','curler']];function svg(name,color,kind){let shape='';switch(kind){case'lip':shape=`<rect x="35" y="42" width="30" height="39" rx="4" fill="#262433"/><rect x="39" y="31" width="22" height="16" fill="#d5b4a2"/><path d="M39 31V20Q50 5 61 20V31Z" fill="${color}"/>`;break;case'gloss':shape=`<rect x="34" y="35" width="32" height="48" rx="9" fill="${color}"/><rect x="38" y="12" width="24" height="27" rx="4" fill="#32283a"/>`;break;case'compact':shape=`<circle cx="50" cy="52" r="35" fill="#c79a75"/><circle cx="50" cy="52" r="29" fill="${color}"/><path d="M27 39Q50 21 73 39" fill="none" stroke="#fff9" stroke-width="5"/>`;break;case'palette':shape=`<rect x="8" y="23" width="84" height="58" rx="9" fill="#5a4059"/><rect x="13" y="29" width="74" height="46" rx="5" fill="#f8e5f0"/>${[0,1,2,3,4,5].map(i=>`<circle cx="${29+i%3*21}" cy="${41+Math.floor(i/3)*22}" r="8" fill="${['#dc9cb2','#d8b4e8','#ad82b1','#f3c19c','#b77e95','#e9c8a2'][i]}"/>`).join('')}`;break;case'perfume':shape=`<rect x="27" y="30" width="46" height="54" rx="10" fill="${color}" stroke="#fff" stroke-width="3"/><rect x="43" y="16" width="14" height="15" fill="#d8b77b"/><rect x="36" y="8" width="28" height="11" rx="3" fill="#544459"/><circle cx="50" cy="56" r="11" fill="#fff8"/>`;break;case'bottle':shape=`<rect x="30" y="28" width="40" height="57" rx="8" fill="${color}"/><rect x="38" y="17" width="24" height="14" rx="2" fill="#c4a2aa"/><rect x="48" y="10" width="24" height="5" rx="2" fill="#8d7385"/><rect x="44" y="11" width="5" height="9" fill="#8d7385"/><rect x="36" y="48" width="28" height="17" rx="4" fill="#fff9"/>`;break;case'mascara':shape=`<rect x="40" y="34" width="20" height="52" rx="5" fill="${color}"/><rect x="43" y="12" width="14" height="24" rx="3" fill="#d4a5b7"/>`;break;case'pencil':shape=`<path d="M40 86L44 17Q50 5 56 17L60 86Z" fill="${color}"/><path d="M40 86L50 98L60 86" fill="#e5c2a0"/><path d="M46 92L50 98L54 92" fill="#3c2e3b"/>`;break;case'brush':shape=`<rect x="45" y="42" width="10" height="48" rx="4" fill="#aa7a65"/><rect x="42" y="32" width="16" height="15" rx="3" fill="#d6b5b7"/><path d="M42 34Q29 9 50 8Q71 9 58 34Z" fill="${color}"/>`;break;case'polish':shape=`<rect x="29" y="39" width="42" height="44" rx="10" fill="${color}"/><rect x="40" y="13" width="20" height="29" rx="4" fill="#26222f"/>`;break;case'jar':shape=`<rect x="19" y="42" width="62" height="39" rx="11" fill="${color}"/><rect x="16" y="30" width="68" height="16" rx="5" fill="#d2b6c7"/><rect x="31" y="54" width="38" height="13" rx="5" fill="#fff9"/>`;break;case'dropper':shape=`<rect x="33" y="36" width="34" height="49" rx="9" fill="${color}"/><rect x="40" y="20" width="20" height="20" fill="#c6a8b7"/><rect x="43" y="9" width="14" height="15" rx="6" fill="#37303e"/>`;break;case'tube':shape=`<path d="M29 21H71L65 83H35Z" fill="${color}"/><rect x="34" y="81" width="32" height="10" rx="3" fill="#c7a9b4"/><rect x="35" y="37" width="30" height="22" rx="4" fill="#fff9"/>`;break;case'mask':shape=`<rect x="20" y="16" width="60" height="71" rx="13" fill="${color}"/><circle cx="39" cy="46" r="5" fill="#78596d"/><circle cx="61" cy="46" r="5" fill="#78596d"/><path d="M41 68Q50 76 59 68" stroke="#78596d" fill="none" stroke-width="3"/>`;break;case'sponge':shape=`<path d="M50 9Q82 46 75 67Q70 88 50 88Q30 88 25 67Q18 46 50 9Z" fill="${color}"/>`;break;case'curler':shape=`<path d="M22 28Q50 7 78 28M22 28V49Q50 70 78 49V28M40 57L29 88M60 57L71 88" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"/>`;break}return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><ellipse cx="50" cy="90" rx="25" ry="5" fill="#492c3b33"/>${shape}</svg>`)}const art=types.map(t=>svg(...t));const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);let level=1,items=[],tray=[],history=[],undos=3,shuffles=3,done=0,ended=false,serial=0;function init(){items=[];tray=[];history=[];undos=3;shuffles=3;done=0;ended=false;$('veil').classList.remove('show');let bag=[];for(let i=0;i<30;i++){let kind=rnd(types.length);bag.push(kind,kind,kind)}for(let i=bag.length-1;i>0;i--){let j=rnd(i+1);[bag[i],bag[j]]=[bag[j],bag[i]]}for(let i=0;i<90;i++){let layer=Math.floor(i/18),a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.42;items.push({id:++serial,kind:bag[i],x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r*.82,z:layer,size:112+rnd(25),rot:rnd(41)-20})}draw();$('msg').textContent='盆里有 90 件超大美妆好物！'}function top(t){return !items.some(o=>o.id!==t.id&&o.z>t.z&&Math.hypot((o.x-t.x)*1.1,(o.y-t.y)*1.3)<(o.size+t.size)/1150)}function preview(t){$('previewImg').src=art[t.kind];$('previewImg').alt=types[t.kind][0];$('preview').classList.add('show')}function hidePreview(){$('preview').classList.remove('show')}function draw(){hidePreview();const b=$('bowl'),w=b.clientWidth,h=b.clientHeight;b.replaceChildren();for(let t of items){let el=document.createElement('button');el.className='item';let img=document.createElement('img');img.src=art[t.kind];img.alt=types[t.kind][0];el.append(img);el.style.width=t.size+'px';el.style.height=t.size+'px';el.style.left=Math.max(0,Math.min(w-t.size,t.x*w-t.size/2))+'px';el.style.top=Math.max(0,Math.min(h-t.size,t.y*h-t.size/2))+'px';el.style.zIndex=t.z*1000+t.id%1000;el.style.transform='rotate('+t.rot+'deg)';el.setAttribute('aria-label','抓取'+types[t.kind][0]);el.onpointerdown=()=>preview(t);el.onpointerup=hidePreview;el.onpointercancel=hidePreview;el.onpointerleave=hidePreview;el.onblur=hidePreview;el.oncontextmenu=e=>e.preventDefault();el.onclick=()=>{hidePreview();pick(t.id)};b.append(el)}const c=$('tray');c.replaceChildren();for(let i=0;i<7;i++){let s=document.createElement('div');s.className='slot';if(i<tray.length){let img=document.createElement('img');img.src=art[tray[i]];img.alt=types[tray[i]][0];s.append(img)}c.append(s)}$('level').textContent=level;$('left').textContent=items.length;$('done').textContent=done;$('undo').textContent='↩ 撤回 '+undos;$('shuffle').textContent='🔀 洗牌 '+shuffles;$('undo').disabled=!undos||!history.length||ended;$('shuffle').disabled=!shuffles||!items.length||ended}function pick(id){if(ended)return;let index=items.findIndex(t=>t.id===id);if(index<0)return;let t=items[index];if(!top(t)){$('msg').textContent='这件化妆品被压住了，先抓上面的！';return}history.push({items:items.map(o=>({...o})),tray:[...tray],done});items.splice(index,1);let pos=tray.lastIndexOf(t.kind);tray.splice(pos<0?tray.length:pos+1,0,t.kind);if(tray.filter(x=>x===t.kind).length===3){tray=tray.filter(x=>x!==t.kind);done+=3;$('msg').textContent='✨ 三件相同，消除成功！'}else $('msg').textContent='继续找相同的化妆品！';draw();if(!items.length&&!tray.length)finish(true);else if(tray.length>=7)finish(false)}function finish(win){ended=true;$('title').textContent=win?'🪿 抓到大鹅啦！':'🧺 收集篮满了';$('detail').textContent=win?'90 件美妆好物全部清空，恭喜过关！':'可以重新挑战！';$('again').textContent=win?'下一关':'重新挑战';$('veil').classList.add('show');draw()}$('undo').onclick=()=>{if(!history.length||!undos||ended)return;let h=history.pop();items=h.items;tray=h.tray;done=h.done;undos--;draw()};$('shuffle').onclick=()=>{if(!shuffles||ended)return;let kinds=items.map(t=>t.kind);for(let i=kinds.length-1;i>0;i--){let j=rnd(i+1);[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}items.forEach((t,i)=>t.kind=kinds[i]);shuffles--;draw();$('msg').textContent='🔀 已重新混合盆内美妆好物'};$('restart').onclick=init;$('again').onclick=()=>{if(!items.length&&!tray.length)level++;init()};window.addEventListener('resize',draw);window.addEventListener('pointerup',hidePreview);window.addEventListener('pointercancel',hidePreview);init()})();</script></body></html>
